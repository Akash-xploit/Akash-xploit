<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img">
<style>
.sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.line{opacity:0;animation:in .45s ease-out forwards} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".35" stop-color="#fff" stop-opacity=".06"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/>
  </linearGradient>
  <clipPath id="win"><rect x="0.5" y="0.5" width="1199" height="371" rx="12"/></clipPath>
  <clipPath id="body"><rect x="1" y="39" width="1198" height="332" rx="11"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="1199" height="371" rx="12" fill="#101826" fill-opacity=".92"/>
<g clip-path="url(#win)">
  <rect x="0" y="0" width="1200" height="38" fill="#fff" fill-opacity=".045"/>
  <rect x="0" y="38" width="1200" height="1" fill="#fff" fill-opacity=".07"/>
</g>
<circle cx="22" cy="19.5" r="6" fill="#ff5f57"/><circle cx="42" cy="19.5" r="6" fill="#febc2e"/><circle cx="62" cy="19.5" r="6" fill="#28c840"/>
<text x="84" y="24" text-anchor="start" class="mono" font-size="12.5" fill="#3fa9f5">~/profile</text>
<text x="1178" y="25" text-anchor="end" class="sans" font-size="14" font-weight="600" fill="#f2f6fb">Operator profile</text>
<rect x="0.5" y="0.5" width="1199" height="371" rx="12" fill="none" stroke="url(#rim)" stroke-width="1"/>
<rect x="0.5" y="0.5" width="1199" height="371" rx="12" fill="none" stroke="#3fa9f5" stroke-opacity=".28"/>
<defs><pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="14" height="14" fill="#f5b942"/><rect width="7" height="14" fill="#f5b942" fill-opacity=".55"/>
  <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 0" dur="1s" repeatCount="indefinite" additive="sum"/>
</pattern></defs>
<text x="36" y="74" class="mono line" style="animation-delay:0.25s" font-size="15"><tspan fill="#3ddc97">$</tspan><tspan fill="#f2f6fb"> cat profile</tspan></text>
<text x="36" y="102" class="mono line" style="animation-delay:0.60s" font-size="15"><tspan fill="#6b7a8c">role</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">Aspiring Blue Team / Cloud Security Engineer</tspan></text>
<text x="36" y="130" class="mono line" style="animation-delay:0.95s" font-size="15"><tspan fill="#6b7a8c">focus</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">AWS Security · Detection Engineering · SOC Operations</tspan></text>
<text x="36" y="158" class="mono line" style="animation-delay:1.30s" font-size="15"><tspan fill="#6b7a8c">secondary</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">DFIR · Threat Hunting · Security Monitoring</tspan></text>
<text x="36" y="196" class="mono line" style="animation-delay:1.65s" font-size="15"><tspan fill="#3ddc97">$</tspan><tspan fill="#f2f6fb"> cat current_ops</tspan></text>
<text x="36" y="224" class="mono line" style="animation-delay:2.00s" font-size="15"><tspan fill="#6b7a8c">working on</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">AWS Secure Vault</tspan></text>
<text x="36" y="252" class="mono line" style="animation-delay:2.35s" font-size="15"><tspan fill="#6b7a8c">learning</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">AWS Security, Threat Detection, and SOC Workflows</tspan></text>
<text x="36" y="280" class="mono line" style="animation-delay:2.70s" font-size="15"><tspan fill="#6b7a8c">fun fact</tspan><tspan x="190" fill="#a9b6c6">→</tspan><tspan x="220" fill="#f2f6fb">I like building security projects that feel like real-world operations.</tspan></text>
<text x="36" y="318" class="mono line" style="animation-delay:3.05s" font-size="15"><tspan fill="#3ddc97">$</tspan><tspan fill="#f2f6fb"> status</tspan></text>
<g class="line" style="animation-delay:3.40s">
  <rect x="36" y="328" width="520" height="12" rx="6" fill="#fff" fill-opacity=".07"/>
  <rect x="36" y="328" width="300" height="12" rx="6" fill="url(#stripes)"/>
  <text x="576" y="339" class="mono" font-size="14" fill="#f5b942">SECURING THE STACK</text>
</g>
</svg>